services:
  shiny-app:
    build: .
    image: shiny-app
    command: Rscript --verbose /home/shiny-app/app.R
    working_dir: /srv/shiny-server
    volumes:
      - ./app.R:/home/shiny-app/app.R
      - ./www:/srv/shiny-server/www
      - ./data:/srv/shiny-server/data
      - ./content:/srv/shiny-server/content
      - ./R:/srv/shiny-server/R
    ports:
      - 8180:8180